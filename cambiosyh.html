<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Cambios YH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
:root{
  --bg:#0B1210; --bg2:#0E1714; --surface:#121D19; --surface2:#182620; --line:#23362E; --line2:#2E453B;
  --txt:#F2EFE4; --mut:#95A79D; --mut2:#5F7168;
  --gold:#E9B44C; --gold2:#D99A2B; --goldSoft:rgba(233,180,76,.13);
  --ok:#43DFA9; --okSoft:rgba(67,223,169,.12);
  --bad:#F27A7A; --badSoft:rgba(242,122,122,.12);
  --warn:#E9B44C; --warnSoft:rgba(233,180,76,.14);
  --r:18px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:radial-gradient(1200px 500px at 50% -140px, #14231D 0%, var(--bg) 55%);color:var(--txt);
  font:15px/1.5 'Inter',system-ui,sans-serif;padding-bottom:calc(132px + env(safe-area-inset-bottom))}
h1,h2,h3{font-family:'Space Grotesk',system-ui,sans-serif}
.num{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;letter-spacing:-.02em}

/* header — tablero */
header{position:sticky;top:0;z-index:20;background:rgba(11,18,16,.88);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);padding:calc(12px + env(safe-area-inset-top)) 18px 12px;
  display:flex;align-items:center;justify-content:space-between}
header h1{font-size:18px;font-weight:700;letter-spacing:.3px}
header h1 span{color:var(--gold)}
#hdrCap{font-size:10px;color:var(--mut);text-align:right;text-transform:uppercase;letter-spacing:1.2px}
#hdrCap b{display:block;color:var(--gold);font-size:15px;letter-spacing:0;margin-top:1px}
main{padding:16px 14px 24px;max-width:760px;margin:0 auto}
.tab{display:none}.tab.on{display:block;animation:fadeUp .22s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* dock flotante */
nav{position:fixed;bottom:calc(12px + env(safe-area-inset-bottom));left:12px;right:12px;z-index:30;
  background:rgba(16,26,22,.92);backdrop-filter:blur(18px);border:1px solid var(--line2);
  border-radius:22px;display:flex;max-width:640px;margin:0 auto;
  box-shadow:0 12px 34px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.04)}
nav button{flex:1;background:none;border:0;color:var(--mut2);font:600 10.5px 'Inter';
  padding:10px 0 9px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;
  border-radius:18px;margin:4px 2px;transition:all .18s}
nav button svg{width:22px;height:22px}
nav button.on{color:#14100a;background:linear-gradient(160deg,var(--gold),var(--gold2));
  box-shadow:0 6px 16px rgba(233,180,76,.35)}

/* tarjetas */
.card{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--line);
  border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:0 1px 0 rgba(255,255,255,.03) inset}
.card h3{font-size:11.5px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:1.4px;margin-bottom:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--line);
  border-radius:16px;padding:13px 14px}
.kpi small{color:var(--mut);font-size:10px;text-transform:uppercase;letter-spacing:1.1px}
.kpi b{display:block;font-family:'IBM Plex Mono',monospace;font-size:18px;margin-top:5px;font-weight:600}
.kpi.ok b{color:var(--ok)} .kpi.bad b{color:var(--bad)} .kpi.warn b{color:var(--gold)}

/* tablero de capital — firma */
#cuadre{position:relative;background:linear-gradient(150deg,#17251F 0%,#0F1A15 70%);
  border:1px solid var(--line2);border-radius:22px;padding:20px 18px 16px;margin-bottom:14px;overflow:hidden}
#cuadre:before{content:"";position:absolute;inset:0 0 auto 0;height:3px;
  background:linear-gradient(90deg,transparent,var(--gold) 30%,var(--gold) 70%,transparent)}
#cuadre small{color:var(--mut);font-size:10px;letter-spacing:1.6px;text-transform:uppercase}
#cuadre .big{font-family:'IBM Plex Mono',monospace;font-size:32px;font-weight:600;color:var(--gold);
  margin:6px 0 8px;text-shadow:0 0 26px rgba(233,180,76,.25)}
#cuadre .sub{font-size:12.5px;color:var(--mut)}
#cuadre .sub b{font-family:'IBM Plex Mono',monospace}

/* monedas */
.mon{border-left:3px solid var(--gold)}
.mon .top{display:flex;justify-content:space-between;align-items:baseline}
.mon .top b{font-family:'IBM Plex Mono',monospace;font-size:19px;font-weight:600}
.mon .prom{font-size:12px;color:var(--gold);margin-top:2px}
.mon table{width:100%;margin-top:9px;border-collapse:collapse}
.mon td{padding:6px 0;font-size:13.5px;border-top:1px dashed var(--line)}
.mon td:last-child{text-align:right;font-family:'IBM Plex Mono',monospace;font-size:13px}
.neg{color:var(--bad)} .pos{color:var(--ok)}

/* formularios */
label{display:block;font-size:10.5px;color:var(--mut);margin:14px 0 6px;text-transform:uppercase;letter-spacing:1.1px;font-weight:600}
input,select,textarea{width:100%;background:var(--surface2);border:1.5px solid var(--line);border-radius:14px;
  color:var(--txt);font:16px 'Inter';padding:13px 14px;transition:border .15s, box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(233,180,76,.15)}
input[readonly]{background:#0D1512;color:var(--gold);font-family:'IBM Plex Mono',monospace;border-style:dashed}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rowB{display:grid;grid-template-columns:1fr 48px;gap:8px;align-items:end}
.addBtn{height:48px;border-radius:14px;background:var(--okSoft);color:var(--ok);
  font:700 22px 'Inter';cursor:pointer;border:1.5px solid rgba(67,223,169,.35);transition:all .15s}
.addBtn:active{transform:scale(.94)}

/* chips segmentados */
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 2px 8px;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;background:var(--surface2);border:1.5px solid var(--line);color:var(--mut);
  border-radius:999px;padding:10px 17px;font:600 13px 'Inter';cursor:pointer;transition:all .15s}
.chip:active{transform:scale(.96)}
.chip.on{background:linear-gradient(160deg,var(--gold),var(--gold2));border-color:transparent;color:#14100a;
  box-shadow:0 5px 14px rgba(233,180,76,.3)}

/* botones */
.btn{width:100%;border:0;border-radius:15px;padding:15px;font:700 15px 'Inter';cursor:pointer;margin-top:16px;
  letter-spacing:.2px;transition:transform .12s, box-shadow .15s}
.btn.p{background:linear-gradient(160deg,var(--gold),var(--gold2));color:#171106;
  box-shadow:0 8px 22px rgba(233,180,76,.28)}
.btn.g{background:var(--surface2);color:var(--txt);border:1.5px solid var(--line2)}
.btn.d{background:var(--badSoft);color:var(--bad);border:1.5px solid rgba(242,122,122,.3)}
.btn:active{transform:scale(.98)}
.hint{font-size:12.5px;color:var(--mut);margin-top:8px}
.preview{background:var(--okSoft);border:1.5px solid rgba(67,223,169,.3);border-radius:14px;
  padding:12px 14px;margin-top:14px;font-size:14px;display:none}
.preview.bad{background:var(--badSoft);border-color:rgba(242,122,122,.35)}
.preview b{font-family:'IBM Plex Mono',monospace}
.check{display:flex;align-items:center;gap:11px;margin-top:14px;font-size:14px;color:var(--txt)}
.check input{width:21px;height:21px;accent-color:var(--gold)}

/* historial */
.op{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--line);
  border-radius:16px;padding:13px 14px;margin-bottom:9px}
.op .l1{display:flex;justify-content:space-between;align-items:center;gap:8px}
.badge{font:700 10px 'Inter';padding:4px 11px;border-radius:999px;letter-spacing:.7px;text-transform:uppercase}
.b-compra{background:var(--goldSoft);color:var(--gold)}
.b-venta{background:var(--okSoft);color:var(--ok)}
.b-directa{background:rgba(120,180,255,.13);color:#7FB2F2}
.b-transfer{background:#1E2E28;color:#9BB5A9}
.b-entrada{background:var(--okSoft);color:var(--ok)}
.b-salida{background:var(--badSoft);color:var(--bad)}
.b-abono{background:rgba(190,150,255,.13);color:#C4A4F5}
.b-anulada{background:#1C2620;color:var(--mut2);text-decoration:line-through}
.op .mto{font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:600}
.op .det{font-size:12.5px;color:var(--mut);margin-top:6px}
.op .uti{font-size:12.5px;margin-top:4px}
.op .uti b{color:var(--ok);font-family:'IBM Plex Mono',monospace}
.op .fio{font-size:10.5px;color:var(--gold);margin-top:4px;font-weight:700;letter-spacing:.6px}
.op.anulada{opacity:.45}
.op .acts{margin-top:9px}
.mini{background:none;border:1.5px solid var(--line2);color:var(--mut);border-radius:10px;
  padding:6px 13px;font:600 12px 'Inter';cursor:pointer;transition:all .15s}
.mini:active{transform:scale(.95)}
.mini.red{color:var(--bad);border-color:rgba(242,122,122,.35)}
.mini.grn{color:var(--ok);border-color:rgba(67,223,169,.35)}

/* cuentas */
.cta{padding:12px 0;border-top:1px dashed var(--line)}
.cta:first-of-type{border-top:0}
.ctaTop{display:flex;justify-content:space-between;align-items:center;gap:10px}
.cta .nom{font-weight:600;font-size:14.5px}
.cta .nom small{display:block;color:var(--mut2);font-size:11px;font-weight:400}
.cta .sal{font-family:'IBM Plex Mono',monospace;font-size:15px;text-align:right;font-weight:600;white-space:nowrap}
.ctaBtns{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}
.tag4{font-size:9px;background:var(--goldSoft);color:var(--gold);border-radius:6px;padding:2px 6px;
  margin-left:6px;vertical-align:middle;font-weight:700;letter-spacing:.3px}

/* modal */
#modalBg{position:fixed;inset:0;background:rgba(4,8,6,.75);backdrop-filter:blur(4px);z-index:40;
  display:none;align-items:flex-end;justify-content:center}
#modalBg.on{display:flex}
#modal{background:linear-gradient(180deg,#152420,#0F1A15);border:1px solid var(--line2);
  border-radius:24px 24px 0 0;width:100%;max-width:560px;
  padding:20px 18px calc(24px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto;
  animation:slideUp .25s ease}
@keyframes slideUp{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
#modal h2{font-size:18px;margin-bottom:3px}
#modal .sub{color:var(--mut);font-size:13px}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(104px + env(safe-area-inset-bottom));
  background:#1A2A23;border:1.5px solid var(--gold);color:var(--txt);padding:12px 20px;border-radius:14px;
  font-size:14px;z-index:60;display:none;max-width:88%;text-align:center;
  box-shadow:0 10px 30px rgba(0,0,0,.5)}
.empty{text-align:center;color:var(--mut2);padding:40px 10px;font-size:14px}
.filtros{display:flex;gap:8px;margin-bottom:12px}
.filtros select,.filtros input{padding:10px 12px;font-size:14px}
.subchips{display:flex;gap:8px;margin-bottom:12px}
@media(min-width:600px){ .grid2{grid-template-columns:repeat(4,1fr)} }

/* PC / pantalla ancha: navegación lateral izquierda */
@media(min-width:760px){
  body{padding-bottom:40px}
  nav{left:16px;right:auto;top:50%;bottom:auto;transform:translateY(-50%);
    flex-direction:column;width:92px;border-radius:26px;padding:10px 0;margin:0}
  nav button{margin:4px 9px;padding:13px 0 11px;font-size:11px}
  main{margin-left:126px;margin-right:auto;max-width:820px;padding-left:20px;padding-right:20px}
  header{padding-left:130px}
  #toast{bottom:40px}
}
</style>
</head>
<body>

<script>
/* ================================================================
   CONFIG — edita aquí sin miedo
   ================================================================ */
const CONFIG = {
  APP_ID: "cambiosyh",
  NOMBRE: "Cambios YH",
  IMPUESTO_4X1000: 0.004,
  MONEDAS: [
    { id:"COP",   nombre:"Pesos",        simbolo:"$",   base:true, dec:0 },
    { id:"BS",    nombre:"Bolívares",    simbolo:"Bs",  dec:2 },
    { id:"USD",   nombre:"USD Efectivo", simbolo:"US$", dec:2 },
    { id:"ZELLE", nombre:"Zelle",        simbolo:"Z$",  dec:2 },
    { id:"USDT",  nombre:"USDT",         simbolo:"₮",   dec:2 }
  ],
  CUENTAS_INICIALES: [
    { nombre:"Bancolombia JAS",     moneda:"COP", aplica4x1000:true },
    { nombre:"Bancolombia YH",      moneda:"COP", aplica4x1000:true },
    { nombre:"Bancolombia Edgar",   moneda:"COP", aplica4x1000:true },
    { nombre:"Bancolombia Yosmel",  moneda:"COP", aplica4x1000:true },
    { nombre:"Efectivo COP",        moneda:"COP" },
    { nombre:"Bs Venezuela Yhosue", moneda:"BS" },
    { nombre:"Bs Venezuela Mamá",   moneda:"BS" }
  ]
};
/* ================================================================ */

const LSK = "cambiosyh_v1"; // misma llave: migra tus datos de la v1 automáticamente
let S = null;

function freshState(){
  const cuentas = CONFIG.CUENTAS_INICIALES.map((c,i)=>({
    id:"c"+(i+1), nombre:c.nombre, moneda:c.moneda,
    saldo:0, aplica4x1000:!!c.aplica4x1000, activa:true, notas:""
  }));
  const inv = {};
  CONFIG.MONEDAS.filter(m=>!m.base).forEach(m=>inv[m.id]={cant:0,costo:0});
  return { cuentas, inv, ops:[], clientes:[], seq:cuentas.length, cliSeq:0, opSeq:0, sheetsUrl:"" };
}
function migrar(st){
  if(!st.clientes) st.clientes=[];
  if(!st.cliSeq) st.cliSeq=0;
  return st;
}
function load(){
  try{ const raw = localStorage.getItem(LSK); if(raw){ S = migrar(JSON.parse(raw)); return; } }catch(e){}
  S = freshState(); save();
}
function save(){ localStorage.setItem(LSK, JSON.stringify(S)); }

/* ---------- utilidades ---------- */
const $ = id => document.getElementById(id);
function mon(id){ return CONFIG.MONEDAS.find(m=>m.id===id); }
function cta(id){ return S.cuentas.find(c=>c.id===id); }
function cli(id){ return S.clientes.find(c=>c.id===id); }
function ctasDe(mid){ return S.cuentas.filter(c=>c.activa && c.moneda===mid); }
function fmt(n, mid){
  const m = mon(mid)||{dec:0};
  return (Number(n)||0).toLocaleString("es-CO",{minimumFractionDigits:m.dec>0&&(n%1!==0)?2:0, maximumFractionDigits:m.dec});
}
function fmtS(n, mid){ const m=mon(mid); return (m?m.simbolo+" ":"")+fmt(n,mid); }
function parseNum(str){
  if(typeof str==="number") return str;
  if(!str) return 0;
  str = String(str).trim().replace(/\s/g,"");
  const dots=(str.match(/\./g)||[]).length, comas=(str.match(/,/g)||[]).length;
  if(dots&&comas){ str=str.replace(/\./g,"").replace(/,/g,"."); }      // 8.812,50
  else if(comas>1){ str=str.replace(/,/g,""); }                        // 1,234,567
  else if(comas===1){ str=str.replace(",","."); }                      // 3,67
  else if(dots>1){ str=str.replace(/\./g,""); }                        // 8.812.569
  else if(dots===1){
    const dec=str.split(".")[1]||"";
    if(dec.length===3) str=str.replace(".","");                        // 1.500 = mil quinientos
    // 1 o 2 dígitos tras el punto = decimal (3.67 del numpad) → se deja igual
  }
  const v = parseFloat(str);
  return isNaN(v)?0:v;
}
function promedio(mid){ const i=S.inv[mid]; return (i&&i.cant>0)? i.costo/i.cant : 0; }
function hoyStr(){ return new Date().toISOString().slice(0,10); }
function mesStr(){ return new Date().toISOString().slice(0,7); }
function toast(msg){
  const t=$("toast"); t.textContent=msg; t.style.display="block";
  clearTimeout(t._t); t._t=setTimeout(()=>t.style.display="none",2600);
}
function esc(s){ return String(s||"").replace(/</g,"&lt;"); }

/* ---------- motor (partida doble) ----------
   movs:  [{cuentaId, delta}]        → saldos de cuentas
   cmovs: [{clienteId, delta}]       → saldo cliente: + te debe, − tú le debes
   invFx: {moneda, dCant, dCosto}    → inventario / promedio
   Anular = revertir todo. Nada se borra. */

function aplicarMovs(movs, dir){ (movs||[]).forEach(mv=>{ const c=cta(mv.cuentaId); if(c) c.saldo += dir*mv.delta; }); }
function aplicarCMovs(cmovs, dir){ (cmovs||[]).forEach(mv=>{ const c=cli(mv.clienteId); if(c) c.saldo += dir*mv.delta; }); }
function aplicarInv(invFx, dir){
  if(!invFx) return;
  const i = S.inv[invFx.moneda]; if(!i) return;
  i.cant += dir*invFx.dCant; i.costo += dir*invFx.dCosto;
}
function registrarOp(op){
  S.opSeq++; op.n=S.opSeq; op.fecha=new Date().toISOString(); op.anulada=false;
  aplicarMovs(op.movs,1); aplicarCMovs(op.cmovs,1); aplicarInv(op.invFx,1);
  S.ops.unshift(op); save(); renderAll();
}
function anularOp(n){
  const op = S.ops.find(o=>o.n===n);
  if(!op || op.anulada) return;
  if(!confirm("¿Anular la operación #"+n+"? Se revierten todos sus efectos.")) return;
  aplicarMovs(op.movs,-1); aplicarCMovs(op.cmovs,-1); aplicarInv(op.invFx,-1);
  op.anulada=true; op.fechaAnulada=new Date().toISOString();
  save(); renderAll(); toast("Operación #"+n+" anulada y revertida");
}
function calc4x1000(cuentaId, monto){
  const c = cta(cuentaId);
  return (c && c.aplica4x1000 && c.moneda==="COP") ? Math.round(monto*CONFIG.IMPUESTO_4X1000) : 0;
}

/* ---------- clientes ---------- */
function nuevoClienteRapido(selectId){
  const nom = prompt("Nombre del cliente / proveedor:");
  if(!nom || !nom.trim()) return;
  S.cliSeq++;
  const c = { id:"k"+S.cliSeq, nombre:nom.trim(), tel:"", nota:"", saldo:0 };
  S.clientes.push(c); save();
  if(selectId && $(selectId)){
    $(selectId).innerHTML = cliOpts(c.id);
  }
  renderCliList();
  toast("Cliente creado: "+c.nombre);
}
function diasSinMov(cliId){
  const op=S.ops.find(o=>!o.anulada && (o.cliId===cliId || o.cliP===cliId || o.cruce===cliId));
  if(!op) return null;
  return Math.floor((Date.now()-new Date(op.fecha).getTime())/86400000);
}
function cliOpts(sel){
  const base = `<option value="">— sin cliente —</option>`;
  return base + S.clientes.map(c=>`<option value="${c.id}" ${c.id===sel?"selected":""}>${esc(c.nombre)}${c.saldo?` (${c.saldo>0?"debe":"le debes"} ${fmt(Math.abs(c.saldo),"COP")})`:""}</option>`).join("");
}

/* ---------- FORM OPERAR ---------- */
let tipoOp = "compra";
const TIPOS = [
  {id:"compra",nombre:"Compra"},{id:"venta",nombre:"Venta"},{id:"directa",nombre:"Directa"},
  {id:"abono",nombre:"Abono"},{id:"transfer",nombre:"Transferencia"},
  {id:"entrada",nombre:"Entrada"},{id:"salida",nombre:"Salida"}
];
function setTipo(t){
  tipoOp=t;
  document.querySelectorAll("#tipoChips .chip").forEach(ch=>ch.classList.toggle("on",ch.dataset.t===t));
  buildForm();
}
function opts(list, sel){
  return list.map(c=>`<option value="${c.id}" ${c.id===sel?"selected":""}>${esc(c.nombre)}${c.aplica4x1000?" ⁴ˣ¹⁰⁰⁰":""}</option>`).join("");
}
function monedaOpts(){
  return CONFIG.MONEDAS.filter(m=>!m.base).map(m=>`<option value="${m.id}">${m.nombre} (${m.id})</option>`).join("");
}
function cliSelect(id, labelTxt){
  return `<label>${labelTxt}</label>
  <div class="rowB">
    <select id="${id}" onchange="preview()">${cliOpts()}</select>
    <button class="addBtn" type="button" onclick="nuevoClienteRapido('${id}')">+</button>
  </div>`;
}
function mixOpts(){
  return `<optgroup label="Tus cuentas COP">${opts(ctasDe("COP"))}</optgroup>`
    + `<optgroup label="Clientes / proveedores (cruce)">`
    + S.clientes.map(c=>`<option value="CLI:${c.id}">→ ${esc(c.nombre)}${c.saldo?` (${c.saldo>0?"debe":"le debes"} ${fmt(Math.abs(c.saldo),"COP")})`:""}</option>`).join("")
    + `</optgroup>`;
}
function esCruce(v){ return typeof v==="string" && v.indexOf("CLI:")===0; }
function cruceId(v){ return v.slice(4); }

function buildForm(){
  const f = $("formBody");
  const copCtas = ctasDe("COP");
  if(!copCtas.length && ["compra","venta","directa","abono"].includes(tipoOp)){

      <div><label>Monto</label><input id="fMonto" inputmode="decimal" placeholder="0" oninput="preview()"></div>
      <div><label>Tasa (COP por 1)</label><input id="fTasa" inputmode="decimal" placeholder="0" oninput="preview()"></div>
    </div>
    <label>Total a pagar (COP)</label><input id="fTotal" readonly>
    ${cliSelect("fCli","Proveedor")}
    <div class="check"><input type="checkbox" id="fFiado" onchange="preview()"><span>Queda pendiente de pago (crédito del proveedor)</span></div>
    <div id="fPagoWrap">

    </div>
    <div id="fSoloHacia" style="display:none"><label>Recibes en</label><select id="fHacia2"></select></div>
    <label>Nota</label><input id="fNota" placeholder="Opcional">
    <div class="preview" id="fPrev"></div>
    <button class="btn p" onclick="guardarOp()">+ Registrar compra</button>`;
  }
  else if(tipoOp==="venta"){
    html = `
    <label>Moneda que vendes</label><select id="fMon" onchange="onMonChange()">${monedaOpts()}</select>
    <div class="row">
      <div><label>Monto</label><input id="fMonto" inputmode="decimal" placeholder="0" oninput="preview()"></div>
      <div><label>Tasa venta (COP por 1)</label><input id="fTasa" inputmode="decimal" placeholder="0" oninput="preview()"></div>
    </div>
    <label>Total a recibir (COP)</label><input id="fTotal" readonly>
    ${cliSelect("fCli","Cliente")}
    <div class="check"><input type="checkbox" id="fFiado" onchange="preview()"><span>Fiado — el cliente queda debiendo</span></div>
    <div class="row">
      <div><label>Sale desde</label><select id="fDesde"></select></div>
      <div id="fHaciaWrap"><label>Recibes COP en</label><select id="fHacia" onchange="preview()">${opts(copCtas)}</select></div>
    </div>
    <label>Nota</label><input id="fNota" placeholder="Opcional">
    <div class="preview" id="fPrev"></div>
    <button class="btn p" onclick="guardarOp()">+ Registrar venta</button>`;
  }
  else if(tipoOp==="directa"){
    html = `
    <p class="hint">Compras y vendes en la misma jugada, sin pasar por tu inventario.</p>
    <label>Moneda de referencia</label><select id="fMon">${monedaOpts()}</select>
    <label>Monto</label><input id="fMonto" inputmode="decimal" placeholder="0" oninput="preview()">
    <div class="row">
      <div><label>Tasa compra</label><input id="fTasaC" inputmode="decimal" placeholder="0" oninput="preview()"></div>
      <div><label>Tasa venta</label><input id="fTasa" inputmode="decimal" placeholder="0" oninput="preview()"></div>
    </div>
    ${cliSelect("fCliP","Proveedor")}
    <div class="check"><input type="checkbox" id="fFiadoP" onchange="preview()"><span>Proveedor queda pendiente de pago</span></div>
    <div id="fPagoWrap"><label>Pagas proveedor desde</label><select id="fDesde" onchange="preview()">${opts(copCtas)}</select>
      <div class="check" id="f4xWrap" style="display:none"><input type="checkbox" id="f4x" checked onchange="preview()"><span>Descontar 4x1000 (<b id="f4xVal">0</b>)</span></div>
    </div>
    ${cliSelect("fCli","Cliente")}
    <div class="check"><input type="checkbox" id="fFiado" onchange="preview()"><span>Fiado — el cliente queda debiendo</span></div>
    <div id="fCobroWrap"><label>Cliente te paga en</label><select id="fHacia" onchange="preview()">${opts(copCtas)}</select></div>
    <label>Nota</label><input id="fNota" placeholder="Opcional">
    <div class="preview" id="fPrev"></div>
    <button class="btn p" onclick="guardarOp()">+ Registrar directa</button>`;
  }
  else if(tipoOp==="abono"){
    if(!S.clientes.length){ f.innerHTML=`<p class="hint">Aún no tienes clientes. Crea uno con el botón + en Compra, Venta o en la pestaña Cuentas → Clientes.</p>`; return; }
    html = `
    <div class="chips" id="abonoDir">
      <button class="chip on" data-d="cobro" onclick="abonoDir('cobro')">Cliente te abona</button>
      <button class="chip" data-d="pago" onclick="abonoDir('pago')">Pagas a proveedor</button>
    </div>
    ${cliSelect("fCli","Cliente / proveedor")}
    <label>Monto (COP)</label><input id="fMonto" inputmode="decimal" placeholder="0" oninput="preview()">
    <div id="abCobro"><label>Entra a</label><select id="fHacia" onchange="preview()">${mixOpts()}</select>
      <label>Comisión del que recibe % (opcional)</label>
      <div class="chips" style="padding-bottom:2px">
        <button type="button" class="chip" onclick="$('fCom').value='0,1';preview()">0,1%</button>
        <button type="button" class="chip" onclick="$('fCom').value='0,2';preview()">0,2%</button>
        <button type="button" class="chip" onclick="$('fCom').value='';preview()">Sin comisión</button>
      </div>
      <input id="fCom" inputmode="decimal" placeholder="Ej: 0,2" oninput="preview()">

    <div id="abPago" style="display:none"><label>Sale desde</label><select id="fDesde" onchange="preview()">${mixOpts()}</select>
      <div class="check" id="f4xWrap" style="display:none"><input type="checkbox" id="f4x" checked onchange="preview()"><span>Descontar 4x1000 (<b id="f4xVal">0</b>)</span></div>
    </div>
    <p class="hint">Si eliges un cliente/proveedor en vez de una cuenta, es un cruce: la plata no toca tus bancos, solo se mueven las deudas.</p>
    <label>Nota</label><input id="fNota" placeholder="Opcional">
    <div class="preview" id="fPrev"></div>
    <button class="btn p" onclick="guardarOp()">✓ Registrar abono</button>`;

  else if(tipoOp==="transfer"){
    html = `
    <p class="hint">Mueve plata entre tus propias cuentas de la misma moneda.</p>
    <label>Moneda</label><select id="fMonT" onchange="buildTransferCtas()">${CONFIG.MONEDAS.map(m=>`<option value="${m.id}">${m.nombre} (${m.id})</option>`).join("")}</select>
    <div class="row">

      <div><label>Hacia</label><select id="fHacia"></select></div>

    <div class="check" id="f4xWrap" style="display:none"><input type="checkbox" id="f4x" checked onchange="preview()"><span>Descontar 4x1000 (<b id="f4xVal">0</b>)</span></div>
    <label>Nota</label><input id="fNota" placeholder="Opcional">
    <div class="preview" id="fPrev"></div>
    <button class="btn p" onclick="guardarOp()">↔ Registrar transferencia</button>`;
  }
  else {
    const esE = tipoOp==="entrada";
    const cats = esE ? ["Aporte de capital","Ingreso extra","Ajuste"] : ["Gasto","Retiro personal","Comisión bancaria","Ajuste"];
    html = `
    <p class="hint">${esE?"Plata que entra sin ser una operación de cambio.":"Plata que sale sin ser una operación de cambio."}</p>
    <label>Cuenta</label><select id="fDesde" onchange="preview()">${opts(S.cuentas.filter(c=>c.activa))}</select>
    <label>Monto (en la moneda de la cuenta)</label><input id="fMonto" inputmode="decimal" placeholder="0" oninput="preview()">
    <div id="fCostoWrap" style="display:none"><label>Costo (COP por 1) — para el promedio</label><input id="fCosto" inputmode="decimal" placeholder="Ej: 3,67" oninput="preview()"></div>
    <label>Categoría</label><select id="fCat">${cats.map(c=>`<option>${c}</option>`).join("")}</select>
    ${esE?"":'<div class="check" id="f4xWrap" style="display:none"><input type="checkbox" id="f4x" checked onchange="preview()"><span>Descontar 4x1000 (<b id="f4xVal">0</b>)</span></div>'}
    <label>Nota</label><input id="fNota" placeholder="Opcional">
    <div class="preview" id="fPrev"></div>
    <button class="btn p" onclick="guardarOp()">${esE?"↓ Registrar entrada":"↑ Registrar salida"}</button>`;

  f.innerHTML = html;
  if(tipoOp==="compra"||tipoOp==="venta") onMonChange();
  if(tipoOp==="transfer") buildTransferCtas();
  preview();

let abDir="cobro";
function abonoDir(d){
  abDir=d;
  document.querySelectorAll("#abonoDir .chip").forEach(c=>c.classList.toggle("on",c.dataset.d===d));
  $("abCobro").style.display = d==="cobro"?"block":"none";
  $("abPago").style.display = d==="pago"?"block":"none";
  preview();
}
function onMonChange(){
  const mid=$("fMon").value, cts=ctasDe(mid);
  const sel = cts.length?opts(cts):`<option value="">— crea una cuenta de ${mid} —</option>`;
  if(tipoOp==="compra"){ $("fHacia").innerHTML=sel; if($("fHacia2")) $("fHacia2").innerHTML=sel; }
  else if(tipoOp==="venta"){ $("fDesde").innerHTML=sel; }
  preview();
}
function buildTransferCtas(){
  const cts=ctasDe($("fMonT").value);
  $("fDesde").innerHTML=opts(cts); $("fHacia").innerHTML=opts(cts);
  preview();
}

function preview(){
  const prev=$("fPrev"); if(!prev) return;
  const monto=parseNum($("fMonto")&&$("fMonto").value);
  let html="", show=false;
  const wrap4=$("f4xWrap");
  function upd4(cuentaId, base){
    if(!wrap4) return 0;
    const imp=calc4x1000(cuentaId, base);
    wrap4.style.display = imp>0?"flex":"none";
    if($("f4xVal")) $("f4xVal").textContent=fmt(imp,"COP");
    return ($("f4x")&&$("f4x").checked)?imp:0;
  }
  const fiado = $("fFiado")&&$("fFiado").checked;
  const fiadoP = $("fFiadoP")&&$("fFiadoP").checked;

  if(tipoOp==="compra"){
    if($("fPagoWrap")) $("fPagoWrap").style.display = fiado?"none":"block";
    if($("fSoloHacia")) $("fSoloHacia").style.display = fiado?"block":"none";
    const tasa=parseNum($("fTasa").value), total=monto*tasa;
    $("fTotal").value = total?fmt(Math.round(total),"COP"):"";
    if(!fiado) upd4($("fDesde").value, total);
    if(monto&&tasa){
      const mid=$("fMon").value, i=S.inv[mid];
      const nuevoProm=(i.costo+total)/((i.cant+monto)||1);
      html = (fiado?`Compra a crédito: quedas debiendo <b>${fmtS(Math.round(total),"COP")}</b>`:`Pagas <b>${fmtS(Math.round(total),"COP")}</b>`)
        + ` · Nuevo promedio ${mid}: <b>${nuevoProm.toFixed(2)}</b>`;
      show=true;
    }
  }
  else if(tipoOp==="venta"){
    if($("fHaciaWrap")) $("fHaciaWrap").style.display = fiado?"none":"block";
    const tasa=parseNum($("fTasa").value), total=monto*tasa;
    $("fTotal").value = total?fmt(Math.round(total),"COP"):"";
    if(monto&&tasa){
      const mid=$("fMon").value, p=promedio(mid), uti=total-monto*p;
      html = (fiado?`Fiado: el cliente queda debiendo <b>${fmtS(Math.round(total),"COP")}</b>`:`Recibes <b>${fmtS(Math.round(total),"COP")}</b>`)
        + (p>0?` · Utilidad: <b>${fmtS(Math.round(uti),"COP")}</b>`:` · Sin promedio aún`);
      prev.classList.toggle("bad", uti<0&&p>0);
      show=true;
    }
  }
  else if(tipoOp==="directa"){
    if($("fPagoWrap")) $("fPagoWrap").style.display = fiadoP?"none":"block";
    if($("fCobroWrap")) $("fCobroWrap").style.display = fiado?"none":"block";
    const tc=parseNum($("fTasaC").value), tv=parseNum($("fTasa").value);
    if(monto&&tc&&tv){
      const totC=Math.round(monto*tc), totV=Math.round(monto*tv);
      const imp = fiadoP?0:upd4($("fDesde").value, totC);
      const uti = totV-totC-imp;
      html = `${fiado?`Cliente queda debiendo <b>${fmtS(totV,"COP")}</b>`:`Cliente paga <b>${fmtS(totV,"COP")}</b>`} · ${fiadoP?`Quedas debiendo <b>${fmtS(totC,"COP")}</b>`:`Pagas <b>${fmtS(totC,"COP")}</b>`}${imp?` + ${fmt(imp,"COP")} 4x1000`:""} · Utilidad: <b>${fmtS(uti,"COP")}</b>`;
      prev.classList.toggle("bad", uti<0);
      show=true;
    }
  }
  else if(tipoOp==="abono"){
    const c=cli($("fCli").value);
    const dest = abDir==="cobro" ? ($("fHacia")&&$("fHacia").value) : ($("fDesde")&&$("fDesde").value);
    const cruce = esCruce(dest);
    const imp = (abDir==="pago" && !cruce) ? upd4(dest, monto) : 0;
    if(wrap4 && cruce) wrap4.style.display="none";
    if(monto&&c){
      if(cruce){
        const o=cli(cruceId(dest));
        if(o && o.id===c.id){ html="Elige dos clientes distintos para el cruce"; prev.classList.add("bad"); }
        else if(o){
          prev.classList.remove("bad");
          if(abDir==="cobro"){
            const pct=parseNum($("fCom")&&$("fCom").value);
            const com=pct>0?Math.round(monto*pct/100):0;
            html = `Cruce: <b>${esc(c.nombre)}</b> abona <b>${fmtS(monto,"COP")}</b> a <b>${esc(o.nombre)}</b>`
              + (com?` · ${esc(o.nombre)} te queda debiendo el neto <b>${fmtS(monto-com,"COP")}</b> (comisión ${fmt(com,"COP")})`:` · ${esc(o.nombre)} te queda debiendo <b>${fmtS(monto,"COP")}</b>`)
              + ` · Tus bancos no se tocan`;
          } else {
            html = `Cruce: <b>${esc(o.nombre)}</b> paga por ti <b>${fmtS(monto,"COP")}</b> a <b>${esc(c.nombre)}</b> · Tus bancos no se tocan`;
          }
        }
      } else {
        if(abDir==="cobro"){
          const pct=parseNum($("fCom")&&$("fCom").value);
          const com=pct>0?Math.round(monto*pct/100):0;
          html = `<b>${esc(c.nombre)}</b> abona <b>${fmtS(monto,"COP")}</b>`
            + (com?` · Entra neto <b>${fmtS(monto-com,"COP")}</b> (comisión ${fmt(com,"COP")})`:"")
            + ` · Quedaría ${c.saldo-monto>0?"debiendo":"a favor"} <b>${fmt(Math.abs(c.saldo-monto),"COP")}</b>`;
        } else {
          html = `Pagas <b>${fmtS(monto,"COP")}</b>${imp?` + ${fmt(imp,"COP")} 4x1000`:""} a <b>${esc(c.nombre)}</b> · Saldo quedaría en <b>${fmt(Math.abs(c.saldo+monto),"COP")}</b> ${c.saldo+monto>=0?"(te debe)":"(le debes)"}`;
        }
      }
      show=true;
    } else if(monto && !c){ html="Elige el cliente"; show=true; }
  }
  else if(tipoOp==="transfer"){
    const imp=upd4($("fDesde")&&$("fDesde").value, monto);
    if(monto){ const c=cta($("fDesde").value); html=`Mueves <b>${c?fmtS(monto,c.moneda):fmt(monto)}</b>${imp?` · Sale ${fmt(imp,"COP")} extra por 4x1000`:""}`; show=true; }
  }
  else if(tipoOp==="salida"){
    const imp=upd4($("fDesde").value, monto);
    if(monto){
      const c=cta($("fDesde").value);
      let extra="";
      if(c&&c.moneda!=="COP"){ const p=promedio(c.moneda); if(p>0) extra=` · Sale del inventario a costo ${p.toFixed(2)}`; }
      html=`Sale <b>${c?fmtS(monto,c.moneda):""}</b>${imp?` + ${fmt(imp,"COP")} de 4x1000`:""}${extra}`; show=true;
    }
  }
  else if(tipoOp==="entrada"){
    const c=cta($("fDesde").value);
    const noCOP = c && c.moneda!=="COP";
    if($("fCostoWrap")) $("fCostoWrap").style.display = noCOP?"block":"none";
    if(monto){
      let extra="";
      if(noCOP){
        const costo=parseNum($("fCosto")&&$("fCosto").value);
        const i=S.inv[c.moneda];
        const nuevoProm=(i.costo+monto*costo)/((i.cant+monto)||1);
        extra = costo>0 ? ` · Nuevo promedio ${c.moneda}: <b>${nuevoProm.toFixed(2)}</b>` : ` · <span style="color:var(--warn)">Sin costo el promedio baja — ponle el costo real</span>`;
      }
      html=`Entra <b>${c?fmtS(monto,c.moneda):""}</b>${extra}`; show=true;
    }
  }
  prev.innerHTML=html; prev.style.display=show?"block":"none";
}

function chkSaldo(cuentaId, necesita){
  const c=cta(cuentaId);
  if(c && c.saldo<necesita){
    return confirm(`Ojo: "${c.nombre}" quedaría en ${fmtS(c.saldo-necesita,c.moneda)} (negativo). ¿Registrar igual?`);
  }
  return true;
}

function guardarOp(){
  const monto=parseNum($("fMonto")&&$("fMonto").value);
  if(!monto||monto<=0){ toast("Ingresa el monto"); return; }
  const nota=($("fNota")&&$("fNota").value.trim())||"";
  const cliId=($("fCli")&&$("fCli").value)||"";
  const fiado=$("fFiado")&&$("fFiado").checked;
  const fiadoP=$("fFiadoP")&&$("fFiadoP").checked;

  if(tipoOp==="compra"){
    const mid=$("fMon").value, tasa=parseNum($("fTasa").value);
    if(!tasa){toast("Ingresa la tasa");return;}
    if(fiado && !cliId){toast("Para crédito elige el proveedor");return;}
    const hacia = fiado ? $("fHacia2").value : $("fHacia").value;
    if(!hacia){toast("Crea primero una cuenta de "+mid);return;}
    const total=Math.round(monto*tasa);
    let movs=[{cuentaId:hacia,delta:monto}], cmovs=null, imp=0, desde="";
    if(fiado){ cmovs=[{clienteId:cliId,delta:-total}]; }
    else{
      desde=$("fDesde").value;
      imp=($("f4x")&&$("f4x").checked)?calc4x1000(desde,total):0;
      if(!chkSaldo(desde,total+imp)) return;
      movs.push({cuentaId:desde,delta:-(total+imp)});
    }
    registrarOp({ tipo:"compra", moneda:mid, monto, tasa, total, imp4x:imp, cliId, fiado:!!fiado, nota,
      movs, cmovs, invFx:{moneda:mid,dCant:monto,dCosto:total}, desde, hacia, utilidad:0 });
    toast("Compra registrada"+(fiado?" (a crédito)":""));
  }
  else if(tipoOp==="venta"){
    const mid=$("fMon").value, tasa=parseNum($("fTasa").value);
    const desde=$("fDesde").value;
    if(!tasa){toast("Ingresa la tasa");return;}
    if(!desde){toast("Crea primero una cuenta de "+mid);return;}
    if(fiado && !cliId){toast("Para fiar elige el cliente");return;}
    const total=Math.round(monto*tasa);
    const p=promedio(mid), costo=Math.round(monto*p), uti=total-costo;
    if(!chkSaldo(desde,monto)) return;
    let movs=[{cuentaId:desde,delta:-monto}], cmovs=null, hacia="";
    if(fiado){ cmovs=[{clienteId:cliId,delta:total}]; }
    else{ hacia=$("fHacia").value; movs.push({cuentaId:hacia,delta:total}); }
    registrarOp({ tipo:"venta", moneda:mid, monto, tasa, total, cliId, fiado:!!fiado, nota,
      movs, cmovs, invFx:{moneda:mid,dCant:-monto,dCosto:-costo},
      desde, hacia, utilidad:uti, promUsado:p });
    toast(`Venta registrada · Utilidad ${fmtS(uti,"COP")}`+(fiado?" (fiada)":""));
  }
  else if(tipoOp==="directa"){
    const mid=$("fMon").value, tc=parseNum($("fTasaC").value), tv=parseNum($("fTasa").value);
    if(!tc||!tv){toast("Ingresa las dos tasas");return;}
    const cliP=($("fCliP")&&$("fCliP").value)||"";
    if(fiado&&!cliId){toast("Para fiar elige el cliente");return;}
    if(fiadoP&&!cliP){toast("Para crédito elige el proveedor");return;}
    const totC=Math.round(monto*tc), totV=Math.round(monto*tv);
    let movs=[], cmovs=[], imp=0, desde="", hacia="";
    if(fiado){ cmovs.push({clienteId:cliId,delta:totV}); }
    else{ hacia=$("fHacia").value; movs.push({cuentaId:hacia,delta:totV}); }
    if(fiadoP){ cmovs.push({clienteId:cliP,delta:-totC}); }
    else{
      desde=$("fDesde").value;
      imp=($("f4x")&&$("f4x").checked)?calc4x1000(desde,totC):0;
      if(!chkSaldo(desde,totC+imp)) return;
      movs.push({cuentaId:desde,delta:-(totC+imp)});
    }
    registrarOp({ tipo:"directa", moneda:mid, monto, tasa:tv, tasaC:tc, total:totV, totalC:totC,
      imp4x:imp, cliId, cliP, fiado:!!fiado, fiadoP:!!fiadoP, nota,
      movs, cmovs:cmovs.length?cmovs:null, invFx:null, desde, hacia, utilidad:totV-totC-imp });
    toast(`Directa registrada · Utilidad ${fmtS(totV-totC-imp,"COP")}`);
  }
  else if(tipoOp==="abono"){
    const c=cli(cliId);
    if(!c){toast("Elige el cliente");return;}
    if(abDir==="cobro"){
      const hacia=$("fHacia").value;
      if(esCruce(hacia)){
        const otroId=cruceId(hacia);
        if(otroId===cliId){toast("Elige dos clientes distintos para el cruce");return;}
        const o=cli(otroId);
        const pct=parseNum($("fCom")&&$("fCom").value);
        const com=pct>0?Math.round(monto*pct/100):0;
        registrarOp({ tipo:"abono", dir:"cobro", cruce:otroId, moneda:"COP", monto, comision:com, comPct:pct||0, cliId, nota,
          movs:[], cmovs:[{clienteId:cliId,delta:-monto},{clienteId:otroId,delta:monto-com}],
          invFx:null, utilidad:0 });
        toast(`Cruce registrado: ${esc(c.nombre)} → ${esc(o.nombre)}`+(com?` · neto ${fmt(monto-com,"COP")}`:""));
      } else {
        const pct=parseNum($("fCom")&&$("fCom").value);
        const com=pct>0?Math.round(monto*pct/100):0;
        registrarOp({ tipo:"abono", dir:"cobro", moneda:"COP", monto, comision:com, comPct:pct||0, cliId, nota,
          movs:[{cuentaId:hacia,delta:monto-com}], cmovs:[{clienteId:cliId,delta:-monto}],
          invFx:null, hacia, utilidad:0 });
        toast(`Abono registrado`+(com?` · Comisión ${fmt(com,"COP")}`:""));
      }
    } else {
      const desde=$("fDesde").value;
      if(esCruce(desde)){
        const otroId=cruceId(desde);
        if(otroId===cliId){toast("Elige dos clientes distintos para el cruce");return;}
        const o=cli(otroId);
        registrarOp({ tipo:"abono", dir:"pago", cruce:otroId, moneda:"COP", monto, cliId, nota,
          movs:[], cmovs:[{clienteId:cliId,delta:monto},{clienteId:otroId,delta:-monto}],
          invFx:null, utilidad:0 });
        toast(`Cruce registrado: ${esc(o.nombre)} → ${esc(c.nombre)}`);
      } else {
        const imp=($("f4x")&&$("f4x").checked)?calc4x1000(desde,monto):0;
        if(!chkSaldo(desde,monto+imp)) return;
        registrarOp({ tipo:"abono", dir:"pago", moneda:"COP", monto, imp4x:imp, cliId, nota,
          movs:[{cuentaId:desde,delta:-(monto+imp)}], cmovs:[{clienteId:cliId,delta:monto}],
          invFx:null, desde, utilidad:0 });
        toast(`Pago a ${esc(c.nombre)} registrado`);
      }
    }
  }
  else if(tipoOp==="transfer"){
    const desde=$("fDesde").value, hacia=$("fHacia").value;
    if(desde===hacia){toast("Elige dos cuentas distintas");return;}
    const imp=($("f4x")&&$("f4x").checked)?calc4x1000(desde,monto):0;
    if(!chkSaldo(desde,monto+imp)) return;
    const c=cta(desde);
    registrarOp({ tipo:"transfer", moneda:c.moneda, monto, imp4x:imp, nota,
      movs:[{cuentaId:desde,delta:-(monto+imp)},{cuentaId:hacia,delta:monto}],
      invFx:null, desde, hacia, utilidad:0 });
    toast("Transferencia registrada");
  }
  else if(tipoOp==="entrada"||tipoOp==="salida"){
    const cuentaId=$("fDesde").value, cat=$("fCat").value;
    const c=cta(cuentaId), esE=tipoOp==="entrada";
    const imp=(!esE&&$("f4x")&&$("f4x").checked)?calc4x1000(cuentaId,monto):0;
    if(!esE&&!chkSaldo(cuentaId,monto+imp)) return;
    let invFx=null;
    if(c.moneda!=="COP"){
      if(esE){
        const costo=parseNum($("fCosto")&&$("fCosto").value);
        invFx={moneda:c.moneda,dCant:monto,dCosto:Math.round(monto*costo)};
      } else {
        const p=promedio(c.moneda);
        invFx={moneda:c.moneda,dCant:-monto,dCosto:-Math.round(monto*p)};
      }
    }
    registrarOp({ tipo:tipoOp, moneda:c.moneda, monto, cat, imp4x:imp, nota,
      movs:[{cuentaId,delta:esE?monto:-(monto+imp)}], invFx, desde:cuentaId, utilidad:0 });
    toast((esE?"Entrada":"Salida")+" registrada");
  }
  buildForm();
}

/* ---------- DASHBOARD ---------- */
function utilidadPeriodo(pref){
  let uti=0,gastos=0,imp=0,nOps=0;
  S.ops.forEach(o=>{
    if(o.anulada||!o.fecha.startsWith(pref)) return;
    uti+=o.utilidad||0; imp+=o.imp4x||0; gastos+=o.comision||0;
    if(o.tipo==="salida"&&o.cat==="Gasto"&&o.moneda==="COP") gastos+=o.monto;
    if(["compra","venta","directa"].includes(o.tipo)) nOps++;
  });
  return {uti,gastos,imp,nOps};
}
function cartera(){
  let cobrar=0,pagar=0;
  S.clientes.forEach(c=>{ if(c.saldo>0)cobrar+=c.saldo; else pagar+=-c.saldo; });
  return {cobrar,pagar};
}

    <div class="sub" style="margin-top:4px">Hoy: <b style="color:var(--ok)">${fmtS(Math.round(d.uti),"COP")}</b> en ${d.nOps} operaciones</div>`;

      ${cts.length?`<table>${cts.map(c=>`<tr><td>${esc(c.nombre)}${c.aplica4x1000?'<span class="tag4">4x1000</span>':""}</td><td class="num ${c.saldo<0?'neg':''}">${fmt(c.saldo,mn.id)}</td></tr>`).join("")}</table>`
        :`<div class="hint">Sin cuentas todavía — créala en Cuentas → + Nueva cuenta</div>`}
    </div>`;
  });
  // cartera separada: te deben / les debes
  const meDeben=S.clientes.filter(c=>c.saldo>0).sort((a,b)=>b.saldo-a.saldo);
  const lesDebo=S.clientes.filter(c=>c.saldo<0).sort((a,b)=>a.saldo-b.saldo);
  if(meDeben.length||lesDebo.length){

      <td class="num ${cls}" style="text-align:right;border-top:1px dashed var(--line)">${fmt(Math.abs(c.saldo),"COP")}</td></tr>`;}).join("");
    html+=`<div class="card" style="border-left:3px solid var(--warn)"><h3>Cartera</h3>`;
    if(meDeben.length){
      const t=meDeben.reduce((a,c)=>a+c.saldo,0);

function renderHist(){

  const list=S.ops.filter(o=>{

      const blob=[cN,cP,o.nota,o.cat,o.moneda,String(o.n)].join(" ").toLowerCase();

  });

    const nD=o.desde&&cta(o.desde)?cta(o.desde).nombre:"";
    const nH=o.hacia&&cta(o.hacia)?cta(o.hacia).nombre:"";
    const cN=o.cliId&&cli(o.cliId)?cli(o.cliId).nombre:"";

    let det="";
    if(o.tipo==="compra") det=`${cN?cN+" · ":""}Tasa ${o.tasa}${o.fiado?"":" · "+nD+" → "+nH}${o.fiado?" → "+nH:""}`;
    if(o.tipo==="venta") det=`${cN?cN+" · ":""}Tasa ${o.tasa} · ${nD}${o.fiado?"":" → "+nH}`;
    if(o.tipo==="directa") det=`${cP||"Prov."} ${o.tasaC} → ${cN||"Cliente"} ${o.tasa}`;
    if(o.tipo==="abono"){
      if(o.ini) det=`Saldo inicial de cartera: ${cN}`;

      else det=(o.dir==="cobro"?`${cN} abonó → ${nH}`:`Pago a ${cN} desde ${nD}`);
    }

    if(o.tipo==="entrada"||o.tipo==="salida") det=`${o.cat} · ${nD}`;
    if(o.imp4x) det+=` · 4x1000: ${fmt(o.imp4x,"COP")}`;
    if(o.comision) det+=` · Comisión ${o.comPct?o.comPct+"%":""}: ${fmt(o.comision,"COP")} (entró neto ${fmt(o.monto-o.comision,"COP")})`;
    if(o.nota) det+=` · ${esc(o.nota)}`;
    const montoTxt=(o.tipo==="directa")?fmtS(o.total,"COP"):fmtS(o.monto,o.moneda);
    return `<div class="op ${o.anulada?'anulada':''}">
      <div class="l1">
        <span class="badge ${o.anulada?'b-anulada':'b-'+o.tipo}">${o.anulada?'Anulada':o.tipo}</span>
        <span class="mto num">${montoTxt}</span>
      </div>
      <div class="det">#${o.n} · ${fs} · ${det}</div>
      ${o.utilidad?`<div class="uti">Utilidad: <b class="num">${fmtS(Math.round(o.utilidad),"COP")}</b></div>`:""}
      ${(o.fiado||o.fiadoP)&&!o.anulada?`<div class="fio">⏳ ${o.fiado?"CLIENTE DEBE":""}${o.fiado&&o.fiadoP?" · ":""}${o.fiadoP?"PENDIENTE PAGAR PROVEEDOR":""}</div>`:""}
      ${!o.anulada?`<div class="acts"><button class="mini red" onclick="anularOp(${o.n})">Anular</button></div>`:""}
    </div>`;
  }).join("");
}

/* ---------- CORTE DEL DÍA ---------- */
function datosCorte(dia){
  const ops=S.ops.filter(o=>!o.anulada && o.fecha.startsWith(dia));
  let uti=0,gastos=0,imp=0,n=0;
  const vol={}; // vol[MON]={compra:0,venta:0,copC:0,copV:0}
  const utiMon={}; // utilidad por moneda
  ops.forEach(o=>{
    uti+=o.utilidad||0; imp+=o.imp4x||0; gastos+=o.comision||0;
    if(o.utilidad) utiMon[o.moneda]=(utiMon[o.moneda]||0)+o.utilidad;
    if(o.tipo==="salida"&&o.cat==="Gasto"&&o.moneda==="COP") gastos+=o.monto;
    if(["compra","venta","directa"].includes(o.tipo)){
      n++;
      vol[o.moneda]=vol[o.moneda]||{compra:0,venta:0,copC:0,copV:0};
      if(o.tipo==="compra"){ vol[o.moneda].compra+=o.monto; vol[o.moneda].copC+=o.total; }
      if(o.tipo==="venta"){ vol[o.moneda].venta+=o.monto; vol[o.moneda].copV+=o.total; }
      if(o.tipo==="directa"){ vol[o.moneda].compra+=o.monto; vol[o.moneda].venta+=o.monto; vol[o.moneda].copC+=o.totalC; vol[o.moneda].copV+=o.total; }
    }
  });
  return {ops,uti,gastos,imp,n,vol,utiMon};
}
function renderCorte(dia){
  const box=$("corteBox"); if(!box) return;
  if(!dia){ box.innerHTML=""; return; }
  const d=datosCorte(dia);
  const esMes = dia.length===7;
  const f = esMes
    ? "Mensual · "+new Date(dia+"-15T12:00:00").toLocaleDateString("es-CO",{month:"long",year:"numeric"})
    : new Date(dia+"T12:00:00").toLocaleDateString("es-CO",{weekday:"long",day:"2-digit",month:"long"});
  let volHtml=Object.keys(d.vol).map(m=>{
    const v=d.vol[m];
    return `<tr><td style="padding:4px 0;border-top:1px dashed var(--line)">${m}</td>
      <td class="num" style="text-align:right;border-top:1px dashed var(--line);font-size:12.5px">C: ${fmt(v.compra,m)} · V: ${fmt(v.venta,m)}</td></tr>`;
  }).join("");
  box.innerHTML=`<div class="card" style="border-left:3px solid var(--gold)">
    <h3>Corte · ${f}</h3>
    <div class="grid2" style="margin-bottom:6px">
      <div class="kpi ${d.uti>=0?'ok':'bad'}"><small>${d.uti>=0?'Ganaste':'Perdiste'}</small><b class="num">${fmtS(Math.round(Math.abs(d.uti)),"COP")}</b></div>
      <div class="kpi"><small>Operaciones</small><b class="num">${d.n}</b></div>
      <div class="kpi bad"><small>Gastos</small><b class="num">${fmtS(Math.round(d.gastos),"COP")}</b></div>
      <div class="kpi warn"><small>4x1000</small><b class="num">${fmtS(Math.round(d.imp),"COP")}</b></div>
    </div>
    ${(()=>{
      const ks=Object.keys(d.utiMon);
      if(!ks.length) return "";
      return `<div style="margin:4px 0 8px"><span style="font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:1px">De dónde vino la utilidad</span>
        <table style="width:100%;border-collapse:collapse">${ks.sort((a,b)=>d.utiMon[b]-d.utiMon[a]).map(m=>
          `<tr><td style="padding:4px 0;border-top:1px dashed var(--line)">${m}</td>
           <td class="num ${d.utiMon[m]>=0?'pos':'neg'}" style="text-align:right;border-top:1px dashed var(--line)">${fmtS(Math.round(d.utiMon[m]),"COP")}</td></tr>`).join("")}</table></div>`;
    })()}
    ${volHtml?`<table style="width:100%;border-collapse:collapse">${volHtml}</table>`:""}
    <button class="btn g" style="margin-top:12px" onclick="copiarCorte('${dia}')">📋 Copiar corte para Telegram/WhatsApp</button>
  </div>`;
}
function copiarCorte(dia){
  const d=datosCorte(dia);
  const esMes = dia.length===7;
  const f = esMes
    ? new Date(dia+"-15T12:00:00").toLocaleDateString("es-CO",{month:"long",year:"numeric"}).toUpperCase()
    : new Date(dia+"T12:00:00").toLocaleDateString("es-CO",{day:"2-digit",month:"2-digit",year:"numeric"});
  let t=`📊 CORTE ${esMes?"MENSUAL ":""}${f} — ${CONFIG.NOMBRE}\n`;
  t+=`Operaciones: ${d.n}\n`;
  t+=`${d.uti>=0?"✅ Utilidad":"🔻 Pérdida"}: $ ${fmt(Math.round(Math.abs(d.uti)),"COP")}\n`;
  const um=Object.keys(d.utiMon);
  if(um.length>1) um.sort((a,b)=>d.utiMon[b]-d.utiMon[a]).forEach(m=>{ t+=`   ${m}: $ ${fmt(Math.round(d.utiMon[m]),"COP")}\n`; });
  if(d.gastos) t+=`Gastos: $ ${fmt(Math.round(d.gastos),"COP")}\n`;
  if(d.imp) t+=`4x1000: $ ${fmt(Math.round(d.imp),"COP")}\n`;
  const monKeys=Object.keys(d.vol);
  if(monKeys.length){
    t+=`— Movimiento —\n`;
    monKeys.forEach(m=>{
      const v=d.vol[m];
      if(v.compra) t+=`Compré ${fmt(v.compra,m)} ${m} ($ ${fmt(Math.round(v.copC),"COP")})\n`;
      if(v.venta) t+=`Vendí ${fmt(v.venta,m)} ${m} ($ ${fmt(Math.round(v.copV),"COP")})\n`;
    });
  }
  t+=`— Posición actual —\n`;
  CONFIG.MONEDAS.forEach(mn=>{
    const cts=ctasDe(mn.id); if(!cts.length) return;
    const tot=cts.reduce((a,c)=>a+c.saldo,0);
    if(tot===0) return;
    const p=mn.base?0:promedio(mn.id);
    t+=`${mn.id}: ${fmt(tot,mn.id)}${p>0?` (prom ${p.toFixed(2)})`:""}\n`;
  });
  const {cobrar,pagar}=cartera();
  if(cobrar) t+=`Me deben: $ ${fmt(Math.round(cobrar),"COP")}\n`;
  if(pagar) t+=`Debo: $ ${fmt(Math.round(pagar),"COP")}\n`;
  let cop=0; ctasDe("COP").forEach(c=>cop+=c.saldo);
  let invC=0; Object.keys(S.inv).forEach(k=>invC+=S.inv[k].costo);
  t+=`💰 Capital: $ ${fmt(Math.round(cop+invC+cobrar-pagar),"COP")}`;
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(()=>toast("Corte copiado — pégalo en Telegram"),()=>copiarFallback(t));
  } else copiarFallback(t);
}
function copiarFallback(t){
  const ta=document.createElement("textarea"); ta.value=t; document.body.appendChild(ta);
  ta.select(); document.execCommand("copy"); document.body.removeChild(ta);
  toast("Corte copiado — pégalo en Telegram");
}

        ${c.saldo!==0?`<button class="mini grn" onclick="irAbono('${c.id}')">Abono</button>`:""}

        <button class="mini" onclick="abrirCliente('${c.id}')">Editar</button>

}

function guardarCliente(id){
  const nom=$("mNom").value.trim();
  if(!nom){toast("Ponle nombre");return;}
  let objId=id;
  const mor=$("mMoroso")&&$("mMoroso").checked;
  if(id){ const c=cli(id); c.nombre=nom; c.tel=$("mTel").value.trim(); c.nota=$("mNota").value.trim(); c.moroso=mor; }
  else{ S.cliSeq++; objId="k"+S.cliSeq; S.clientes.push({id:objId,nombre:nom,tel:$("mTel").value.trim(),nota:$("mNota").value.trim(),saldo:0,moroso:mor}); }
  const si=parseNum($("mSaldoIni")&&$("mSaldoIni").value);
  save(); cerrarModal();
  if(si>0){
    const delta = $("mDirIni").value==="debe" ? si : -si;
    registrarOp({ tipo:"abono", ini:true, dir:delta>0?"cobro":"pago", moneda:"COP", monto:si,
      cliId:objId, nota:"Saldo inicial (Excel)", movs:[], cmovs:[{clienteId:objId,delta}],
      invFx:null, utilidad:0 });
  } else { renderAll(); }
  toast("Cliente guardado");
}

/* ---------- estado de cuenta (PDF) ---------- */
function estadoData(cliId){
  // todas las operaciones del cliente, en orden cronológico, con saldo acumulado
  const ops = S.ops.filter(o=>!o.anulada && (o.cliId===cliId || o.cliP===cliId)).slice().reverse();
  let saldo=0;
  return ops.map(o=>{
    let delta=0;
    (o.cmovs||[]).forEach(mv=>{ if(mv.clienteId===cliId) delta+=mv.delta; });
    saldo+=delta;
    const f=new Date(o.fecha);
    const fs=f.toLocaleDateString("es-CO",{day:"2-digit",month:"2-digit",year:"2-digit"});
    let det="";
    if(o.tipo==="compra") det=`Compra ${fmt(o.monto,o.moneda)} ${o.moneda} @ ${o.tasa}`;
    else if(o.tipo==="venta") det=`Venta ${fmt(o.monto,o.moneda)} ${o.moneda} @ ${o.tasa}`;
    else if(o.tipo==="directa") det=`Directa ${fmt(o.monto,o.moneda)} ${o.moneda} @ ${o.cliP===cliId?o.tasaC:o.tasa}`;
    else if(o.tipo==="abono"){
      if(o.ini) det="Saldo inicial";
      else if(o.cruce){ const otro=cli(o.cruce===cliId?o.cliId:o.cruce); det="Cruce con "+(otro?otro.nombre:"otro cliente"); }
      else det=o.dir==="cobro"?"Abono recibido":"Pago realizado";
    }
    if(o.nota) det+=" · "+o.nota;
    const monto = o.tipo==="directa" ? (o.cliP===cliId?o.totalC:o.total) : (o.tipo==="abono"?o.monto:o.total||o.monto);
    return { fecha:fs, det, monto, delta, saldo,
      modo: delta===0 ? "Contado" : (delta>0?"Cargo":(o.tipo==="abono"?"Abono":"Crédito")) };
  });
}
function abrirEstado(cliId){
  const c=cli(cliId); if(!c) return;
  const rows=estadoData(cliId);
  const body = rows.length ? rows.map(r=>`<tr>
      <td style="padding:6px 4px;border-top:1px dashed var(--line);font-size:12px">${r.fecha}</td>
      <td style="padding:6px 4px;border-top:1px dashed var(--line);font-size:12px">${esc(r.det)}<br><small style="color:var(--mut2)">${r.modo}</small></td>
      <td class="num" style="padding:6px 4px;border-top:1px dashed var(--line);text-align:right;font-size:12px">${fmt(r.monto,"COP")}</td>
      <td class="num ${r.saldo>0?'pos':r.saldo<0?'neg':''}" style="padding:6px 4px;border-top:1px dashed var(--line);text-align:right;font-size:12px">${fmt(r.saldo,"COP")}</td>
    </tr>`).join("") : `<tr><td colspan="4" class="empty">Sin operaciones con este cliente</td></tr>`;
  $("modal").innerHTML=`
    <h2>Estado de cuenta</h2>
    <div class="sub">${esc(c.nombre)} · ${new Date().toLocaleDateString("es-CO")}</div>
    <div style="max-height:44vh;overflow-y:auto;margin-top:12px">
    <table style="width:100%;border-collapse:collapse">
      <tr style="color:var(--mut);font-size:11px;text-transform:uppercase"><td>Fecha</td><td>Detalle</td><td style="text-align:right">Monto</td><td style="text-align:right">Saldo</td></tr>
      ${body}
    </table></div>
    <div class="preview" style="display:block;margin-top:14px">Saldo actual: <b class="num">${c.saldo===0?"$ 0 — al día":(c.saldo>0?"debe ":"a favor ")+fmtS(Math.abs(c.saldo),"COP")}</b></div>
    <button class="btn p" onclick="pdfEstado('${cliId}')">⬇ Descargar PDF</button>
    <button class="btn g" onclick="cerrarModal()">Cerrar</button>`;
  $("modalBg").classList.add("on");
}
function pdfEstado(cliId){
  const c=cli(cliId); if(!c) return;
  if(!window.jspdf){ toast("El PDF necesita internet la primera vez"); return; }
  const rows=estadoData(cliId);
  const doc=new window.jspdf.jsPDF();
  const hoy=new Date().toLocaleDateString("es-CO",{day:"2-digit",month:"long",year:"numeric"});
  doc.setFont("helvetica","bold"); doc.setFontSize(16);
  doc.text(CONFIG.NOMBRE,14,18);
  doc.setFontSize(11); doc.setFont("helvetica","normal"); doc.setTextColor(110);
  doc.text("Estado de cuenta",14,25);
  doc.setTextColor(0); doc.setFontSize(12); doc.setFont("helvetica","bold");
  doc.text(c.nombre,14,34);
  doc.setFont("helvetica","normal"); doc.setFontSize(10); doc.setTextColor(110);
  doc.text("Generado el "+hoy+(c.tel?" · "+c.tel:""),14,40);
  doc.autoTable({
    startY:46,
    head:[["Fecha","Detalle","Modo","Monto COP","Saldo COP"]],
    body: rows.map(r=>[r.fecha,r.det,r.modo,fmt(r.monto,"COP"),fmt(r.saldo,"COP")]),
    styles:{fontSize:8.5,cellPadding:2.5},
    headStyles:{fillColor:[27,42,68],textColor:255},
    columnStyles:{3:{halign:"right"},4:{halign:"right"}},
    alternateRowStyles:{fillColor:[244,246,250]}
  });
  const y=(doc.lastAutoTable?doc.lastAutoTable.finalY:46)+10;
  doc.setFontSize(12); doc.setFont("helvetica","bold");
  doc.setTextColor(c.saldo>0?200:0, c.saldo>0?60:120, c.saldo>0?60:60);
  doc.text("SALDO ACTUAL: "+(c.saldo===0?"$ 0 — AL DÍA":(c.saldo>0?"DEBE $ ":"A FAVOR $ ")+fmt(Math.abs(c.saldo),"COP")),14,y);
  doc.setTextColor(150); doc.setFontSize(8); doc.setFont("helvetica","normal");
  doc.text("Documento generado por "+CONFIG.NOMBRE+". Los valores están expresados en pesos colombianos.",14,y+8);
  doc.save("estado_"+c.nombre.replace(/\s+/g,"_")+"_"+hoyStr()+".pdf");
  toast("PDF generado — compártelo por WhatsApp");
}

function abrirCuenta(id){
  const c=id?cta(id):null;
  $("modal").innerHTML=`
    <h2>${c?"Editar cuenta":"Nueva cuenta"}</h2>
    <div class="sub">Nombre, moneda y si el banco cobra 4x1000.</div>
    <label>Nombre</label><input id="mNom" value="${c?esc(c.nombre):""}" placeholder="Bancolombia, Efectivo, Zelle...">
    <label>Moneda</label><select id="mMon" ${c?"disabled":""} onchange="mMonChg()">${CONFIG.MONEDAS.map(m=>`<option value="${m.id}" ${c&&c.moneda===m.id?"selected":""}>${m.nombre} (${m.id})</option>`).join("")}</select>
    ${c?"":`<label>Saldo inicial</label><input id="mSaldo" inputmode="decimal" placeholder="0">`}
    <div class="check" id="m4xWrap"><input type="checkbox" id="m4x" ${c&&c.aplica4x1000?"checked":""}><span>Aplica 4x1000 (solo bancos COP)</span></div>
    ${c?`<div class="check"><input type="checkbox" id="mAct" ${c.activa?"checked":""}><span>Cuenta activa</span></div>`:""}
    <label>Notas</label><input id="mNotas" value="${c?esc(c.notas||""):""}" placeholder="Opcional">
    <button class="btn p" onclick="guardarCuenta('${c?c.id:""}')">Guardar</button>
    ${c?`<button class="btn g" onclick="cerrarModal();irEntrada('${c.id}')">＋ Cargar saldo inicial (Entrada)</button>
    <p class="hint">Para corregir el saldo usa Entrada o Salida con categoría "Ajuste": así el cuadre queda con rastro.</p>`:""}
    <button class="btn g" onclick="cerrarModal()">Cancelar</button>`;
  $("modalBg").classList.add("on");
  mMonChg();
}
function mMonChg(){ $("m4xWrap").style.display=$("mMon").value==="COP"?"flex":"none"; }
function guardarCuenta(id){
  const nom=$("mNom").value.trim();
  if(!nom){toast("Ponle nombre a la cuenta");return;}
  if(id){
    const c=cta(id);
    c.nombre=nom; c.notas=$("mNotas").value.trim();
    c.aplica4x1000=c.moneda==="COP"&&$("m4x").checked;
    if($("mAct")) c.activa=$("mAct").checked;
  } else {
    S.seq++;
    const mid=$("mMon").value, saldoIni=parseNum($("mSaldo").value);
    const nueva={id:"c"+S.seq,nombre:nom,moneda:mid,saldo:0,aplica4x1000:mid==="COP"&&$("m4x").checked,activa:true,notas:$("mNotas").value.trim()};
    S.cuentas.push(nueva);
    if(saldoIni){
      S.opSeq++;
      const op={n:S.opSeq,tipo:"entrada",moneda:mid,monto:saldoIni,cat:"Aporte de capital",nota:"Saldo inicial",
        fecha:new Date().toISOString(),anulada:false,movs:[{cuentaId:nueva.id,delta:saldoIni}],invFx:null,desde:nueva.id,utilidad:0};
      aplicarMovs(op.movs,1); S.ops.unshift(op);
      if(mid!=="COP"){
        const p=prompt(`¿A qué costo (COP por 1 ${mid}) entra ese saldo inicial? Vacío = costo 0.`);
        const pv=parseNum(p);
        const dC=pv>0?Math.round(saldoIni*pv):0;
        S.inv[mid].cant+=saldoIni; S.inv[mid].costo+=dC;
        op.invFx={moneda:mid,dCant:saldoIni,dCosto:dC};
      }
    }
  }
  save(); cerrarModal(); renderAll(); toast("Cuenta guardada");
}
function cerrarModal(){ $("modalBg").classList.remove("on"); }

/* ---------- AJUSTES / SYNC / BACKUP ---------- */
function renderAjustes(){ $("sheetsUrl").value=S.sheetsUrl||""; }
function guardarUrl(){ S.sheetsUrl=$("sheetsUrl").value.trim(); save(); toast("URL guardada"); }
async function subirNube(){
  if(!S.sheetsUrl){toast("Primero pega la URL del Apps Script");return;}
  toast("Subiendo…");
  try{
    await fetch(S.sheetsUrl,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},
      body:JSON.stringify({app:CONFIG.APP_ID,state:S})});
    toast("Datos enviados a la nube ✓");
  }catch(e){toast("Error al subir: "+e.message);}
}
async function bajarNube(){
  if(!S.sheetsUrl){toast("Primero pega la URL del Apps Script");return;}
  if(!confirm("Esto reemplaza los datos de este dispositivo con los de la nube. ¿Continuar?")) return;
  toast("Descargando…");
  try{
    const r=await fetch(S.sheetsUrl+"?app="+CONFIG.APP_ID);
    const j=await r.json();
    const st=j.state||j;
    if(st&&st.cuentas){ st.sheetsUrl=S.sheetsUrl; S=migrar(st); save(); renderAll(); toast("Datos restaurados ✓"); }
    else toast("La nube no tiene datos de esta app");
  }catch(e){toast("Error al descargar: "+e.message);}
}
function exportJSON(){
  const blob=new Blob([JSON.stringify(S,null,1)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=CONFIG.APP_ID+"_backup_"+hoyStr()+".json";
  a.click();
}
function importJSON(ev){
  const file=ev.target.files[0]; if(!file) return;
  const rd=new FileReader();
  rd.onload=()=>{try{
    const st=JSON.parse(rd.result);
    if(!st.cuentas) throw new Error("inválido");
    if(confirm("¿Reemplazar todos los datos con este backup?")){ S=migrar(st); save(); renderAll(); toast("Backup restaurado ✓"); }
  }catch(e){toast("Archivo inválido");}};
  rd.readAsText(file);
}
function resetTodo(){
  if(prompt('Esto BORRA todo en este dispositivo. Escribe "BORRAR" para confirmar:')==="BORRAR"){
    S=freshState(); save(); renderAll(); toast("Sistema reiniciado");
  }
}

function go(tab){
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("on",t.id==="tab-"+tab));
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.tab===tab));
  if(tab==="operar") buildForm();
  if(tab==="ajustes") renderAjustes();
  window.scrollTo(0,0);
}
